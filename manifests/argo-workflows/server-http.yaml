apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-server
spec:
  template:
    spec:
      containers:
        - name: argo-server
          # Port-forward clients speak HTTP. The service stays ClusterIP.
          args:
            - server
            - --secure=false
          readinessProbe:
            httpGet:
              path: /
              port: 2746
              scheme: HTTP
